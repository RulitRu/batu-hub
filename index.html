<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE HUB — Google servislerin</title>
<meta name="description" content="Kişisel Google servisleri portalı">
<script>
  (function () {
    var saved = localStorage.getItem('thehub-theme');
    if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
  })();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <button id="themeToggle" class="theme-toggle" type="button" aria-label="Temayı değiştir" title="Temayı değiştir">
    <span class="toggle-track">
      <span class="toggle-thumb">
        <span class="toggle-icon icon-moon" aria-hidden="true">🌙</span>
        <span class="toggle-icon icon-sun" aria-hidden="true">☀️</span>
      </span>
    </span>
  </button>

  <main class="wrap">

    <header class="hero">
      <h1 class="title">THE HUB</h1>
      <p class="subtitle">Google servislerin, tek yerde</p>
    </header>

    <section class="grid" aria-label="Google servisleri">

      <a class="card" style="--i:0; --accent:#EA4335" href="https://mail.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="E-posta gönder ve al">
        <span class="icon" aria-hidden="true">
          <img src="icons/gmail.png" alt="">
        </span>
        <span class="label">Gmail</span>
      </a>

      <a class="card" style="--i:1; --accent:#4285F4" href="https://docs.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Belge oluştur ve düzenle">
        <span class="icon" aria-hidden="true">
          <img src="icons/docs.png" alt="">
        </span>
        <span class="label">Docs</span>
      </a>

      <a class="card" style="--i:2; --accent:#FBBC05" href="https://drive.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Dosyalarını sakla ve paylaş">
        <span class="icon" aria-hidden="true">
          <img src="icons/drive.png" alt="">
        </span>
        <span class="label">Drive</span>
      </a>

      <a class="card" style="--i:3; --accent:#0F9D58" href="https://sheets.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Hesap tablosu oluştur">
        <span class="icon" aria-hidden="true">
          <img src="icons/sheets.png" alt="">
        </span>
        <span class="label">E-Tablolar</span>
      </a>

      <a class="card" style="--i:4; --accent:#F4B400" href="https://slides.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Sunum hazırla">
        <span class="icon" aria-hidden="true">
          <img src="icons/slides.png" alt="">
        </span>
        <span class="label">Slaytlar</span>
      </a>

      <a class="card" style="--i:5; --accent:#4285F4" href="https://calendar.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Takvim ve etkinlikler">
        <span class="icon" aria-hidden="true">
          <img src="icons/calendar.png" alt="">
        </span>
        <span class="label">Calendar</span>
      </a>

      <a class="card" style="--i:6; --accent:#EA4335" href="https://maps.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Harita ve yol tarifi">
        <span class="icon" aria-hidden="true">
          <img src="icons/maps.png" alt="">
        </span>
        <span class="label">Maps</span>
      </a>

      <a class="card" style="--i:7; --accent:#4285F4" href="https://photos.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Fotoğraflarını görüntüle">
        <span class="icon" aria-hidden="true">
          <img src="icons/photos.png" alt="">
        </span>
        <span class="label">Fotoğraflar</span>
      </a>

      <a class="card" style="--i:8; --accent:#00897B" href="https://meet.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Video görüşme başlat">
        <span class="icon" aria-hidden="true">
          <img src="icons/meet.png" alt="">
        </span>
        <span class="label">Meet</span>
      </a>

      <a class="card" style="--i:9; --accent:#00BFA5" href="https://chat.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Mesajlaş ve grup sohbeti">
        <span class="icon" aria-hidden="true">
          <img src="icons/chat.png" alt="">
        </span>
        <span class="label">Chat</span>
      </a>

      <a class="card" style="--i:10; --accent:#4285F4" href="https://translate.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Metin ve sayfa çevir">
        <span class="icon" aria-hidden="true">
          <img src="icons/translate.png" alt="">
        </span>
        <span class="label">Translate</span>
      </a>

      <a class="card" style="--i:11; --accent:#F4B400" href="https://keep.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Not al ve hatırlatıcı kur">
        <span class="icon" aria-hidden="true">
          <img src="icons/keep.png" alt="">
        </span>
        <span class="label">Keep</span>
      </a>

      <a class="card" style="--i:12; --accent:#4285F4" href="https://passwords.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Kayıtlı şifrelerini yönet">
        <span class="icon" aria-hidden="true">
          <img src="icons/passwords.png" alt="">
        </span>
        <span class="label">Şifreler</span>
      </a>

      <a class="card" style="--i:13; --accent:#673AB7" href="https://forms.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Form ve anket oluştur">
        <span class="icon" aria-hidden="true">
          <img src="icons/forms.png" alt="">
        </span>
        <span class="label">Formlar</span>
      </a>

      <a class="card" style="--i:14; --accent:#4285F4" href="https://one.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Depolama ve abonelik yönetimi">
        <span class="icon" aria-hidden="true">
          <img src="icons/one.png" alt="">
        </span>
        <span class="label">Google One</span>
      </a>

    </section>

  </main>

<script src="script.js"></script>
</body>
</html>
