<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BATU HUB — Google servislerin</title>
<meta name="description" content="Kişisel Google servisleri portalı">
<!-- Tema flaşını (FOUC) önlemek için tema tercihi CSS'ten önce uygulanır -->
<script>
  (function () {
    var saved = localStorage.getItem('batuhub-theme');
    if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
  })();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <button id="themeToggle" class="theme-toggle" type="button" aria-label="Temayı değiştir" title="Temayı değiştir">
    <span id="themeIcon" aria-hidden="true">🌙</span>
  </button>

  <main class="wrap">

    <header class="hero">
      <h1 class="title">BATU HUB</h1>
      <p class="subtitle">Google servislerin</p>
    </header>

    <form id="searchForm" class="search-form" role="search" autocomplete="off">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input
        id="searchInput"
        class="search-input"
        type="text"
        name="q"
        placeholder="Google'da ara..."
        aria-label="Google'da ara"
        autofocus
      >
    </form>

    <section class="grid" aria-label="Google servisleri">

      <a class="card" href="https://mail.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="E-posta gönder ve al">
        <span class="icon" style="--icon-bg:#EA4335" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M3 6.5 12 13l9-6.5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="#fff" stroke-width="1.8"/></svg>
        </span>
        <span class="label">Gmail</span>
      </a>

      <a class="card" href="https://docs.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Belge oluştur ve düzenle">
        <span class="icon" style="--icon-bg:#4285F4" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M6 3h8l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="M14 3v5h5" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><line x1="8" y1="13" x2="16" y2="13" stroke="#fff" stroke-width="1.4"/><line x1="8" y1="16.5" x2="16" y2="16.5" stroke="#fff" stroke-width="1.4"/></svg>
        </span>
        <span class="label">Docs</span>
      </a>

      <a class="card" href="https://drive.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Dosyalarını sakla ve paylaş">
        <span class="icon" style="--icon-bg:#00A65A" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M8 3h8l6 10-4 7H6l-4-7Z" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><line x1="4" y1="13" x2="20" y2="13" stroke="#fff" stroke-width="1.4"/></svg>
        </span>
        <span class="label">Drive</span>
      </a>

      <a class="card" href="https://sheets.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Hesap tablosu oluştur">
        <span class="icon" style="--icon-bg:#0F9D58" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1.5" fill="none" stroke="#fff" stroke-width="1.6"/><line x1="4" y1="9.5" x2="20" y2="9.5" stroke="#fff" stroke-width="1.3"/><line x1="4" y1="14.5" x2="20" y2="14.5" stroke="#fff" stroke-width="1.3"/><line x1="10" y1="4" x2="10" y2="20" stroke="#fff" stroke-width="1.3"/></svg>
        </span>
        <span class="label">E-Tablolar</span>
      </a>

      <a class="card" href="https://slides.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Sunum hazırla">
        <span class="icon" style="--icon-bg:#F4B400" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="1.5" fill="none" stroke="#fff" stroke-width="1.7"/><path d="M9 20h6" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/></svg>
        </span>
        <span class="label">Slaytlar</span>
      </a>

      <a class="card" href="https://calendar.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Takvim ve etkinlikler">
        <span class="icon" style="--icon-bg:#4285F4" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="1.5" fill="none" stroke="#fff" stroke-width="1.6"/><line x1="3.5" y1="9.5" x2="20.5" y2="9.5" stroke="#fff" stroke-width="1.4"/><line x1="7.5" y1="3" x2="7.5" y2="6.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><line x1="16.5" y1="3" x2="16.5" y2="6.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>
        </span>
        <span class="label">Calendar</span>
      </a>

      <a class="card" href="https://maps.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Harita ve yol tarifi">
        <span class="icon" style="--icon-bg:#EA4335" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 21s7-6.4 7-11.5A7 7 0 0 0 5 9.5C5 14.6 12 21 12 21Z" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="9.5" r="2.4" fill="none" stroke="#fff" stroke-width="1.5"/></svg>
        </span>
        <span class="label">Maps</span>
      </a>

      <a class="card" href="https://photos.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Fotoğraflarını görüntüle">
        <span class="icon" style="--icon-bg:#4285F4" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="14" rx="1.5" fill="none" stroke="#fff" stroke-width="1.6"/><circle cx="9" cy="10.5" r="1.6" fill="none" stroke="#fff" stroke-width="1.4"/><path d="M4.5 17.5 9.5 13l3 2.5 3.5-4 3.5 5" fill="none" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>
        </span>
        <span class="label">Fotoğraflar</span>
      </a>

      <a class="card" href="https://meet.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Video görüşme başlat">
        <span class="icon" style="--icon-bg:#00A65A" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="3" y="7" width="12" height="10" rx="1.5" fill="none" stroke="#fff" stroke-width="1.7"/><path d="M15 10.5 21 7.5v9L15 13.5Z" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </span>
        <span class="label">Meet</span>
      </a>

      <a class="card" href="https://chat.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Mesajlaş ve grup sohbeti">
        <span class="icon" style="--icon-bg:#00897B" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 5h16v10H9l-5 4Z" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </span>
        <span class="label">Chat</span>
      </a>

      <a class="card" href="https://translate.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Metin ve sayfa çevir">
        <span class="icon" style="--icon-bg:#4285F4" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="#fff" stroke-width="1.5"/><path d="M3.5 12h17M12 3.5c2.4 2.3 3.6 5.4 3.6 8.5s-1.2 6.2-3.6 8.5c-2.4-2.3-3.6-5.4-3.6-8.5S9.6 5.8 12 3.5Z" fill="none" stroke="#fff" stroke-width="1.3"/></svg>
        </span>
        <span class="label">Translate</span>
      </a>

      <a class="card" href="https://keep.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Not al ve hatırlatıcı kur">
        <span class="icon" style="--icon-bg:#F4B400" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6Z" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="M15 3v4h4" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><line x1="9" y1="12" x2="16" y2="12" stroke="#fff" stroke-width="1.3"/><line x1="9" y1="15.5" x2="14" y2="15.5" stroke="#fff" stroke-width="1.3"/></svg>
        </span>
        <span class="label">Keep</span>
      </a>

      <a class="card" href="https://passwords.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Kayıtlı şifrelerini yönet">
        <span class="icon" style="--icon-bg:#5F6368" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="1.5" fill="none" stroke="#fff" stroke-width="1.6"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="#fff" stroke-width="1.6"/><circle cx="12" cy="15.3" r="1.3" fill="#fff"/></svg>
        </span>
        <span class="label">Şifreler</span>
      </a>

      <a class="card" href="https://forms.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Form ve anket oluştur">
        <span class="icon" style="--icon-bg:#673AB7" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="1.5" fill="none" stroke="#fff" stroke-width="1.6"/><path d="M8.5 9.5 10 11l4-4" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="8.5" y1="15" x2="15.5" y2="15" stroke="#fff" stroke-width="1.4"/></svg>
        </span>
        <span class="label">Formlar</span>
      </a>

      <a class="card" href="https://one.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Depolama ve abonelik yönetimi">
        <span class="icon" style="--icon-bg:#4285F4" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 3 4 8v8l8 5 8-5V8Z" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.6" fill="none" stroke="#fff" stroke-width="1.4"/></svg>
        </span>
        <span class="label">Google One</span>
      </a>

    </section>

  </main>

<script src="script.js"></script>
</body>
</html>
