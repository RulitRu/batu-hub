<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batu Hub — Google servislerin</title>
<meta name="description" content="Kişisel Google servisleri portalı">

<!-- Tema flaşını (FOUC) önlemek için tercih CSS'ten önce uygulanır -->
<script>
  (function () {
    var saved = localStorage.getItem('batuhub-theme');
    if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

  <button id="themeToggle" class="theme-toggle" type="button" aria-label="Temayı değiştir" title="Temayı değiştir">
    <span id="themeIcon" aria-hidden="true">🌙</span>
  </button>

  <main class="wrap">

    <header class="hero">
      <h1 class="title">Batu Hub</h1>
      <p class="subtitle">Google servislerin, tek yerde</p>
    </header>

    <form id="searchForm" class="search-form" role="search" autocomplete="off">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input
        id="searchInput"
        class="search-input"
        type="text"
        name="q"
        placeholder="Google'da ara..."
        aria-label="Google'da ara"
        autofocus
      >
      <kbd class="search-hint" aria-hidden="true">/</kbd>
    </form>

    <!-- İletişim -->
    <section class="category" aria-labelledby="cat-1">
      <div class="category-head">
        <h2 id="cat-1" class="category-title">İletişim</h2>
        <span class="category-line" aria-hidden="true"></span>
      </div>
      <div class="grid">
        <a class="card" href="https://mail.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="E-posta gönder ve al">
          <span class="icon"><img src="https://www.google.com/s2/favicons?sz=128&domain=mail.google.com" alt="" loading="lazy" onerror="this.parentElement.classList.add('icon--fallback')"><span class="icon-fallback">G</span></span>
          <span class="label">Gmail</span>
        </a>
        <a class="card" href="https://chat.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Mesajlaş ve grup sohbeti">
          <span class="icon"><img src="https://www.google.com/s2/favicons?sz=128&domain=chat.google.com" alt="" loading="lazy" onerror="this.parentElement.classList.add('icon--fallback')"><span class="icon-fallback">C</span></span>
          <span class="label">Chat</span>
        </a>
        <a class="card" href="https://meet.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Video görüşme başlat">
          <span class="icon"><img src="https://www.google.com/s2/favicons?sz=128&domain=meet.google.com" alt="" loading="lazy" onerror="this.parentElement.classList.add('icon--fallback')"><span class="icon-fallback">M</span></span>
          <span class="label">Meet</span>
        </a>
      </div>
    </section>

    <!-- Üretkenlik -->
    <section class="category" aria-labelledby="cat-2">
      <div class="category-head">
        <h2 id="cat-2" class="category-title">Üretkenlik</h2>
        <span class="category-line" aria-hidden="true"></span>
      </div>
      <div class="grid">
        <a class="card" href="https://docs.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Belge oluştur ve düzenle">
          <span class="icon"><img src="https://www.google.com/s2/favicons?sz=128&domain=docs.google.com" alt="" loading="lazy" onerror="this.parentElement.classList.add('icon--fallback')"><span class="icon-fallback">D</span></span>
          <span class="label">Docs</span>
        </a>
        <a class="card" href="https://sheets.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Hesap tablosu oluştur">
          <span class="icon"><img src="https://www.google.com/s2/favicons?sz=128&domain=sheets.google.com" alt="" loading="lazy" onerror="this.parentElement.classList.add('icon--fallback')"><span class="icon-fallback">E</span></span>
          <span class="label">E-Tablolar</span>
        </a>
        <a class="card" href="https://slides.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Sunum hazırla">
          <span class="icon"><img src="https://www.google.com/s2/favicons?sz=128&domain=slides.google.com" alt="" loading="lazy" onerror="this.parentElement.classList.add('icon--fallback')"><span class="icon-fallback">S</span></span>
          <span class="label">Slaytlar</span>
        </a>
        <a class="card" href="https://forms.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Form ve anket oluştur">
          <span class="icon"><img src="https://www.google.com/s2/favicons?sz=128&domain=forms.google.com" alt="" loading="lazy" onerror="this.parentElement.classList.add('icon--fallback')"><span class="icon-fallback">F</span></span>
          <span class="label">Formlar</span>
        </a>
      </div>
    </section>

    <!-- Depolama & Medya -->
    <section class="category" aria-labelledby="cat-3">
      <div class="category-head">
        <h2 id="cat-3" class="category-title">Depolama &amp; medya</h2>
        <span class="category-line" aria-hidden="true"></span>
      </div>
      <div class="grid">
        <a class="card" href="https://drive.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Dosyalarını sakla ve paylaş">
          <span class="icon"><img src="https://www.google.com/s2/favicons?sz=128&domain=drive.google.com" alt="" loading="lazy" onerror="this.parentElement.classList.add('icon--fallback')"><span class="icon-fallback">D</span></span>
          <span class="label">Drive</span>
        </a>
        <a class="card" href="https://photos.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Fotoğraflarını görüntüle">
          <span class="icon"><img src="https://www.google.com/s2/favicons?sz=128&domain=photos.google.com" alt="" loading="lazy" onerror="this.parentElement.classList.add('icon--fallback')"><span class="icon-fallback">F</span></span>
          <span class="label">Fotoğraflar</span>
        </a>
      </div>
    </section>

    <!-- Planlama & Konum -->
    <section class="category" aria-labelledby="cat-4">
      <div class="category-head">
        <h2 id="cat-4" class="category-title">Planlama &amp; konum</h2>
        <span class="category-line" aria-hidden="true"></span>
      </div>
      <div class="grid">
        <a class="card" href="https://calendar.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Takvim ve etkinlikler">
          <span class="icon"><img src="https://www.google.com/s2/favicons?sz=128&domain=calendar.google.com" alt="" loading="lazy" onerror="this.parentElement.classList.add('icon--fallback')"><span class="icon-fallback">C</span></span>
          <span class="label">Calendar</span>
        </a>
        <a class="card" href="https://maps.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Harita ve yol tarifi">
          <span class="icon"><img src="https://www.google.com/s2/favicons?sz=128&domain=maps.google.com" alt="" loading="lazy" onerror="this.parentElement.classList.add('icon--fallback')"><span class="icon-fallback">M</span></span>
          <span class="label">Maps</span>
        </a>
      </div>
    </section>

    <!-- Araçlar & Hesap -->
    <section class="category" aria-labelledby="cat-5">
      <div class="category-head">
        <h2 id="cat-5" class="category-title">Araçlar &amp; hesap</h2>
        <span class="category-line" aria-hidden="true"></span>
      </div>
      <div class="grid">
        <a class="card" href="https://translate.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Metin ve sayfa çevir">
          <span class="icon"><img src="https://www.google.com/s2/favicons?sz=128&domain=translate.google.com" alt="" loading="lazy" onerror="this.parentElement.classList.add('icon--fallback')"><span class="icon-fallback">T</span></span>
          <span class="label">Translate</span>
        </a>
        <a class="card" href="https://keep.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Not al ve hatırlatıcı kur">
          <span class="icon"><img src="https://www.google.com/s2/favicons?sz=128&domain=keep.google.com" alt="" loading="lazy" onerror="this.parentElement.classList.add('icon--fallback')"><span class="icon-fallback">K</span></span>
          <span class="label">Keep</span>
        </a>
        <a class="card" href="https://passwords.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Kayıtlı şifrelerini yönet">
          <span class="icon"><img src="https://www.google.com/s2/favicons?sz=128&domain=passwords.google.com" alt="" loading="lazy" onerror="this.parentElement.classList.add('icon--fallback')"><span class="icon-fallback">Ş</span></span>
          <span class="label">Şifreler</span>
        </a>
        <a class="card" href="https://one.google.com" target="_blank" rel="noopener noreferrer" data-tooltip="Depolama ve abonelik yönetimi">
          <span class="icon"><img src="https://www.google.com/s2/favicons?sz=128&domain=one.google.com" alt="" loading="lazy" onerror="this.parentElement.classList.add('icon--fallback')"><span class="icon-fallback">O</span></span>
          <span class="label">Google One</span>
        </a>
      </div>
    </section>

  </main>

<script src="script.js"></script>
</body>
</html>
